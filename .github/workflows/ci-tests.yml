name: CI - Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run type-check and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (Next.js)
        run: npm run build

      - name: Run unit tests
        run: npm run test -- --reporter=verbose
        env:
          CI: true
